# XcodeGen 設定檔：在 Mac 上執行 `xcodegen generate` 即可重新產生 SagitarPad.xcodeproj
# https://github.com/yonaskolb/XcodeGen
name: SagitarPad
options:
  bundleIdPrefix: com.kwok
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: zh-Hant
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
packages:
  SagitarCore:
    path: SagitarCore
targets:
  SagitarPad:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SagitarPad/Sources
      - path: SagitarPad/Resources
      - path: SagitarPad/Info.plist
        buildPhase: none
    dependencies:
      - package: SagitarCore
        product: SagitarCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kwok.sagitarpad
        PRODUCT_NAME: SagitarPad
        INFOPLIST_FILE: SagitarPad/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "2"          # 只支援 iPad
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""                 # 在 Xcode 的 Signing & Capabilities 選你的 Apple ID（Personal Team）
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
schemes:
  SagitarPad:
    build:
      targets:
        SagitarPad: all
    run:
      config: Debug
    archive:
      config: Release
